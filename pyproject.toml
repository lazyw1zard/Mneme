[project]
name = "mneme"
version = "0.1.0"
description = "Portable memory-tag capture primitives before durable memory consolidation."
requires-python = ">=3.11"
dependencies = ["mcp>=1.0"]

[project.scripts]
memory-tag-mcp = "mnion.mcp_server:main"
cogito = "cogito.cli:main"
cogito-hermes-hook = "cogito.hermes_hook:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
