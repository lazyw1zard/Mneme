[project]
name = "nira-mneme"
version = "0.1.0"
description = "Nira Mneme workbench: cheap mnion capture before memory consolidation."
requires-python = ">=3.11"
dependencies = ["mcp>=1.0"]

[project.scripts]
mnion-mcp = "mnion.mcp_server:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
